<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070a12">
<title>Sign in | REDCORE</title>
<link rel="stylesheet" href="style.css">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth-card{width:min(460px,100%);padding:clamp(24px,6vw,42px);border:1px solid #39f5ff40;border-radius:24px;background:linear-gradient(145deg,#121a2b,#0a0e19);box-shadow:0 28px 80px #0008;text-align:center}
.auth-mark{color:#39f5ff;font-size:.78rem;font-weight:900;letter-spacing:.2em}
.auth-card h1{margin:14px 0 10px;font-size:clamp(2rem,8vw,3rem)}
.auth-card p{color:#a7b4ca;line-height:1.65}
.google-button{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;margin-top:24px;padding:15px 18px;border:1px solid #55708c;border-radius:12px;background:#f8fafc;color:#18202c;font-size:1rem;font-weight:800;cursor:pointer}
.google-button:hover{background:white;transform:translateY(-1px)}
.google-g{font:bold 1.3rem Arial;color:#4285f4}
.auth-message{min-height:1.6em;margin-top:14px!important;color:#ffc0d9!important;font-size:.92rem}
.back-link{display:inline-block;margin-top:14px;color:#39f5ff;text-decoration:none}
</style>
</head>
<body>
<main class="auth-card">
  <div class="auth-mark">REDCORE ARCADE</div>
  <h1>Your games,<br>your progress.</h1>
  <p>Use Google to create your REDCORE ID or sign in. Your personal game activity and progress will follow your account.</p>
  <button class="google-button" id="google-sign-in" type="button"><span class="google-g" aria-hidden="true">G</span><span>Continue with Google</span></button>
  <p class="auth-message" id="auth-message" role="status" aria-live="polite"></p>
  <a class="back-link" href="index.html">← Back to the arcade</a>
</main>
<script type="module">
import { signInWithGoogle, finishGoogleRedirect, friendlyAuthError, firebaseReady, auth, onAuthStateChanged } from "./auth.js";
const button = document.querySelector("#google-sign-in");
const message = document.querySelector("#auth-message");
const show = text => { message.textContent = text; };
if (!firebaseReady) {
  button.disabled = true;
  show("Firebase needs to be connected before sign-in can work. See FIREBASE_SETUP.md.");
} else {
  try { await finishGoogleRedirect(); } catch (error) { show(friendlyAuthError(error)); }
  onAuthStateChanged(auth, user => { if (user) location.replace("dashboard.html"); });
  button.addEventListener("click", async () => {
    button.disabled = true;
    show("Opening Google sign-in…");
    try { await signInWithGoogle(); } catch (error) { show(friendlyAuthError(error)); }
    finally { button.disabled = false; }
  });
}
</script>
</body>
</html>
