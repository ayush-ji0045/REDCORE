<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Yadav - REDCORE Game</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4, #45b7d1, #f9ca24);
            color: white;
            text-align: center;
            overflow-x: hidden;
        }
        header {
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 3em;
            margin: 0;
        }
        .game-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
        }
        iframe {
            border: 5px solid white;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }
        footer {
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        @media (max-width: 600px) {
            header { padding: 14px 12px; }
            h1 { font-size: clamp(1.7rem, 8vw, 2.4rem); }
            header p { font-size: .9rem; margin: 8px 0 0; }
            .game-container { min-height: 0; padding: 12px 8px 70px; }
            iframe { display:block; width:100%; max-width:420px; height:min(72dvh, 680px); min-height:420px; border-width:3px; }
            footer { position:fixed; padding:7px 8px; font-size:.75rem; }
        }
        @media (min-width: 601px) {
            .game-container { min-height: calc(100dvh - 150px); padding: 16px; }
            iframe { width:min(400px, 45vw); height:min(72dvh, 680px); }
        }
    </style>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
    <header>
        <h1>Flappy Yadav</h1>
        <p>Enjoy this exciting Flappy Bird-style game!</p>
    </header>
    <div class="game-container">
        <iframe src="https://atulbird.lovable.app/" width="400" height="600" frameborder="0"></iframe>
    </div>
    <footer>
        <p>&copy; 2023 REDCORE. All rights reserved.</p>
    </footer>
    <script type="module" src="game-tracker.js"></script>
</body>
</html>
