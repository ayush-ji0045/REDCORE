<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Yadav - REDCORE Game</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4, #45b7d1, #f9ca24);
            color: white;
            text-align: center;
            overflow-x: hidden;
        }
        header {
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 3em;
            margin: 0;
        }
        .game-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
        }
        iframe {
            border: 5px solid white;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }
        footer {
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Flappy Yadav</h1>
        <p>Enjoy this exciting Flappy Bird-style game!</p>
    </header>
    <div class="game-container">
        <iframe src="https://atulbird.lovable.app/" width="400" height="600" frameborder="0"></iframe>
    </div>
    <footer>
        <p>&copy; 2023 REDCORE. All rights reserved.</p>
    </footer>
</body>
</html>
