<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Day Predictor AI</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle at top,#ffd6e8,#f3a6c8);
    font-family:Segoe UI, sans-serif;
}
.card{
    width:340px;
    padding:22px;
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(10px);
    border-radius:18px;
    box-shadow:0 20px 40px rgba(0,0,0,0.25);
    text-align:center;
    transition:0.5s ease;
}
h2{margin:5px 0}
.sub{
    font-size:12px;
    color:#c0392b;
    margin-bottom:15px;
}
.days button{
    width:46%;
    margin:6px;
    padding:9px;
    border-radius:12px;
    border:1px solid #ccc;
    background:#fff;
    cursor:pointer;
    transition:0.2s;
}
.days button:hover{transform:scale(1.05)}
.days button.active{
    background:#d6ebff;
    border-color:#3498db;
}
#predict{
    margin-top:16px;
    padding:11px;
    width:100%;
    border:none;
    border-radius:14px;
    background:#ccc;
    color:#555;
    cursor:not-allowed;
}
#predict.active{
    background:#ffb703;
    color:#000;
    cursor:pointer;
}
.loader, .result{display:none}
.spinner{
    width:70px;
    height:70px;
    border:6px solid #eee;
    border-top:6px solid #ff9f1c;
    border-radius:50%;
    animation:spin 1.2s linear infinite;
    margin:10px auto;
}
@keyframes spin{
    to{transform:rotate(360deg)}
}
.progress{
    height:8px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
    margin-top:15px;
}
.bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#ff9f1c,#ff4d6d);
}
.loadingText{
    margin-top:12px;
    font-size:14px;
    animation:pulse 1.5s infinite;
}
@keyframes pulse{
    0%{opacity:0.5}
    50%{opacity:1}
    100%{opacity:0.5}
}
.badge{
    background:#e74c3c;
    color:white;
    padding:7px;
    border-radius:12px;
    margin:10px 0;
}
.iq{
    background:#ffcc00;
    padding:8px;
    border-radius:12px;
}
.reset{
    margin-top:14px;
    width:42px;
    height:42px;
    border-radius:50%;
    border:none;
    background:#3498db;
    color:white;
    font-size:18px;
    cursor:pointer;
}
.fade{
    animation:fadeIn 0.6s ease;
}
@keyframes fadeIn{
    from{opacity:0;transform:scale(0.95)}
    to{opacity:1;transform:scale(1)}
}
</style>
</head>

<body>

<div class="card fade">
    <div id="input">
        <h2>Day Predictor AI 🤖</h2>
        <div class="sub">(Please kid stay away)</div>
        <p>Tomorrow is which day?</p>

        <div class="days">
            <button onclick="selectDay(0)">Monday</button>
            <button onclick="selectDay(1)">Tuesday</button>
            <button onclick="selectDay(2)">Wednesday</button>
            <button onclick="selectDay(3)">Thursday</button>
            <button onclick="selectDay(4)">Friday</button>
            <button onclick="selectDay(5)">Saturday</button>
            <button onclick="selectDay(6)">Sunday</button>
        </div>

        <button id="predict">🔮 PREDICT 🔮</button>
    </div>

    <div class="loader fade" id="loader">
        <div class="spinner"></div>
        <div class="loadingText" id="loadText">Initializing time engine…</div>
        <div class="progress"><div class="bar" id="bar"></div></div>
    </div>

    <div class="result fade" id="result">
        <h2>🎉 YOU’RE RIGHT!</h2>
        <p>Yes, tomorrow is <b id="answer"></b></p>
        <div class="badge">Certified Time Decoder</div>
        <div class="iq">Your IQ is higher than 99.9% of humanity</div>
        <button class="reset" onclick="location.reload()">↻</button>
    </div>
</div>

<script>
let selectedDay=null;
const days=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const texts=[
"Initializing time engine…",
"Contacting Jaadu…",
"Decrypting ancient sources…",
"Consulting Lord Brahma…",
"Calling Stephen Hawking…",
"Aligning space-time continuum…",
"Final verification in progress…"
];

function selectDay(i){
    selectedDay=i;
    document.querySelectorAll(".days button").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".days button")[i].classList.add("active");
    let p=document.getElementById("predict");
    p.classList.add("active");
    p.disabled=false;
    p.onclick=start;
}

function start(){
    document.getElementById("input").style.display="none";
    document.getElementById("loader").style.display="block";

    let bar=document.getElementById("bar");
    let text=document.getElementById("loadText");
    let progress=0;
    let idx=0;

    let interval=setInterval(()=>{
        progress+=1;
        bar.style.width=progress+"%";
        if(progress%15===0 && idx<texts.length){
            text.innerText=texts[idx++];
        }
        if(progress>=100){
            clearInterval(interval);
            showResult();
        }
    },120); // slow on purpose
}

function showResult(){
    document.getElementById("loader").style.display="none";
    document.getElementById("result").style.display="block";
    document.getElementById("answer").innerText=days[(selectedDay+1)%7];
}
</script>

</body>
</html>
